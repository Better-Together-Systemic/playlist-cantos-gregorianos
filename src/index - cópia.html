<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cânticos Gregorianos / Taizé — Better Together</title>
<style>
  :root {
    --verde: #1f5c3d;
    --verde-claro: #e8f2ea;
    --dourado: #b8935a;
    --texto: #2b2b2b;
    --fundo: #fbfaf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
    font-size: 20px;
    line-height: 1.6;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  /* ---------- CABEÇALHO ---------- */
  header.topo {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding: 22px 20px 14px;
    max-width: 1100px; margin: 0 auto;
  }
  header.topo img.logo { height: 92px; }
  .id-bloco { display: flex; align-items: center; gap: 16px; }
  .id-bloco img.foto {
    width: 84px; height: 84px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--verde);
  }
  .id-texto { text-align: left; }
  .id-texto .nome {
    font-size: 22px; font-weight: 700; letter-spacing: 3px;
    color: var(--verde);
  }
  .id-texto .cargo { font-size: 18px; color: var(--verde); line-height: 1.35; }
  .barra { height: 8px; background: var(--verde); max-width: 1100px; margin: 0 auto; }

  /* ---------- TÍTULO ---------- */
  .capa {
    display: grid; grid-template-columns: 1fr 380px;
    gap: 36px; align-items: center; padding: 40px 0 30px;
  }
  .capa h1 {
    font-size: 46px; line-height: 1.15; margin: 0 0 16px;
    color: var(--verde);
  }
  .meta { font-size: 21px; font-weight: 600; margin: 6px 0; }
  .meta span { color: var(--verde); }
  .capa img.freq {
    width: 100%; border-radius: 18px;
    box-shadow: 0 10px 34px rgba(0,0,0,.16);
  }
  .frase {
    margin-top: 22px; padding: 18px 22px;
    background: var(--verde-claro); border-left: 8px solid var(--dourado);
    border-radius: 12px; font-size: 21px;
  }

  /* ---------- PLAYER ---------- */
  .player {
    background: #fff; border-radius: 20px; padding: 22px;
    box-shadow: 0 6px 28px rgba(0,0,0,.10); margin-bottom: 30px;
  }
  .player-vazio {
    text-align: center; font-size: 22px; color: #777; padding: 46px 20px;
  }
  .video-box {
    position: relative; width: 100%; padding-top: 56.25%;
    border-radius: 14px; overflow: hidden; background: #000;
  }
  .video-box iframe {
    position: absolute; top:0; left:0; width:100%; height:100%; border:0;
  }
  .tocando {
    font-size: 24px; font-weight: 700; color: var(--verde);
    margin: 0 0 14px;
  }
  .nav-btns { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .nav-btns button {
    font-size: 19px; font-family: inherit; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--verde); background: #fff; color: var(--verde);
  }
  .nav-btns button:hover { background: var(--verde); color: #fff; }
  .nav-btns button.destaque {
    background: var(--verde); color: #fff;
  }
  .nav-btns button.destaque:hover { background: #16452d; }
  .aviso {
    margin-top: 14px; padding: 14px 18px;
    background: #fdf3d8; border-left: 6px solid var(--dourado);
    border-radius: 10px; font-size: 18px; color: #6b5320;
  }

  /* ---------- FILTROS ---------- */
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 26px; }
  .filtros button {
    font-family: inherit; font-size: 19px; font-weight: 600;
    padding: 12px 24px; border-radius: 999px; cursor: pointer;
    border: 2px solid #d5d5d5; background: #fff; color: #555;
  }
  .filtros button.ativo {
    background: var(--verde); border-color: var(--verde); color: #fff;
  }

  /* ---------- LISTA ---------- */
  ul.lista { list-style: none; margin: 0; padding: 0; }
  ul.lista li {
    display: grid; grid-template-columns: 58px 150px 1fr auto auto;
    gap: 18px; align-items: center;
    background: #fff; border-radius: 16px; padding: 16px 20px;
    margin-bottom: 12px; cursor: pointer;
    border: 2px solid transparent;
    transition: transform .15s, box-shadow .15s;
  }
  ul.lista li:hover {
    transform: translateX(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
    border-color: var(--dourado);
  }
  ul.lista li.atual {
    border-color: var(--verde); background: var(--verde-claro);
  }
  .thumb {
    position: relative; width: 150px; height: 84px;
    border-radius: 12px; overflow: hidden;
    background: #e6e4de; flex-shrink: 0;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .thumb .lupa {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.28); opacity: 0;
    transition: opacity .18s; font-size: 30px; color: #fff;
  }
  ul.lista li:hover .thumb .lupa { opacity: 1; }
  li.atual .thumb { outline: 3px solid var(--verde); outline-offset: -3px; }
  .num {
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--verde-claro); color: var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
  }
  li.atual .num { background: var(--verde); color: #fff; }
  .titulo { font-size: 21px; font-weight: 600; }
  .tag {
    font-size: 17px; font-weight: 600; padding: 8px 16px;
    border-radius: 999px; white-space: nowrap;
  }
  .tag.rec { background: #e0f0e5; color: #1f5c3d; }
  .tag.con { background: #fdf3d8; color: #8a6a1f; }
  .tag.int { background: #e4ecf7; color: #24507f; }
  .tag.pre { background: #f3e4ef; color: #7a2c60; }
  .play { font-size: 26px; color: var(--verde); }
  .yt {
    font-size: 17px; color: var(--verde); text-decoration: none;
    font-weight: 600; white-space: nowrap;
  }

  /* ---------- RODAPÉ ---------- */
  footer.rodape {
    border-top: 8px solid var(--verde);
    padding: 22px 20px; margin-top: 40px;
    display: flex; justify-content: center; align-items: center;
    gap: 46px; flex-wrap: wrap; background: #fff;
  }
  footer.rodape a {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 600; color: var(--verde);
    text-decoration: none;
  }
  footer.rodape img { height: 34px; }

  @media (max-width: 820px) {
    body { font-size: 19px; }
    .capa { grid-template-columns: 1fr; }
    .capa h1 { font-size: 34px; }
    ul.lista li {
      grid-template-columns: 46px 120px 1fr;
      gap: 12px; padding: 14px;
    }
    .thumb { width: 120px; height: 68px; }
    .num { width: 44px; height: 44px; font-size: 18px; }
    .titulo { font-size: 18px; }
    .tag {
      grid-column: 2 / 4; justify-self: start;
      font-size: 15px; padding: 6px 12px;
    }
    .play { display: none; }
    header.topo { justify-content: center; text-align: center; }
    .id-texto { text-align: left; }
  }
</style>
</head>

const TRACKS = [{"t": "Taizé – Ubi Caritas", "id": "MYfyoRi3t8I", "c": "Recolhimento interior"}, {"t": "Taizé – Veni Lumen Cordium", "id": "7d1Y5tiOnMs", "c": "Recolhimento interior"}, {"t": "Ludovico Einaudi – Le Onde", "id": "EmStlUk8dKE", "c": "Presença"}, {"t": "Ólafur Arnalds – Near Light", "id": "0kYc55bXJFI", "c": "Contemplativo"}, {"t": "Taizé – Bless the Lord", "id": "lsm919bwwag", "c": "Recolhimento interior"}, {"t": "Secret Garden – Nocturne", "id": "58Q2crEL1Ss", "c": "Contemplativo"}, {"t": "Yiruma – River Flows in You", "id": "7maJOI3QMu0", "c": "Contemplativo"}, {"t": "Brian Crain – Song for Sienna", "id": "SWXJvSuUxnI", "c": "Contemplativo"}, {"t": "Taizé – Jesus Remember Me", "id": "r6tVReXsioM", "c": "Recolhimento interior"}, {"t": "Max Richter – On the Nature of Daylight", "id": "InyT9Gyoz_o", "c": "Contemplativo"}, {"t": "Taizé – Nada Te Turbe", "id": "go1-BoDD7CI", "c": "Recolhimento interior"}, {"t": "Ólafur Arnalds – Saman", "id": "jzcWhWrDnAY", "c": "Recolhimento interior"}, {"t": "Ludovico Einaudi – Nuvole Bianche", "id": "VUCI-1vIbUo", "c": "Contemplativo"}, {"t": "Taizé – In Manus Tuas Pater", "id": "Xff4PlGlBLk", "c": "Recolhimento interior"}, {"t": "Taizé – Laudate Dominum", "id": "rAgT4bPJ5W4", "c": "Recolhimento interior"}, {"t": "Secret Garden – Adagio", "id": "hLob10JpibM", "c": "Integração"}, {"t": "George Winston – Thanksgiving", "id": "XKJRf98GU3o", "c": "Contemplativo"}, {"t": "Taizé – Bonum Est Confidere", "id": "RPNzZwBYZrc", "c": "Recolhimento interior"}, {"t": "Taizé – The Kingdom of God", "id": "WL1_IhVTJmk", "c": "Recolhimento interior"}, {"t": "Ludovico Einaudi – Una Mattina", "id": "-8X_aMT5z0A", "c": "Contemplativo"}, {"t": "Taizé – Veni Sancte Spiritus", "id": "GXwzKtUHFHs", "c": "Recolhimento interior"}, {"t": "Instrumental de piano suave (10 min)", "id": "t_Kd_G7p6ZQ", "c": "Integração"}];
const CLASSES = {"Recolhimento interior":"rec","Contemplativo":"con","Integração":"int","Presença":"pre"};
let atual = -1, filtro = "Todas";

// Detecta se a página foi aberta como arquivo (file://) ou publicada como site.
const MODO_ARQUIVO = (location.protocol === 'file:' || location.origin === 'null');

const lista = document.getElementById('lista');
const player = document.getElementById('player');
const filtros = document.getElementById('filtros');

// Ajusta a caixa de aviso inicial conforme o modo.
if (MODO_ARQUIVO) {
  player.innerHTML = `
    <div class="player-vazio">
      🎧 Toque em qualquer música da lista abaixo.<br>
      Ela abre no YouTube, em uma nova aba.
    </div>`;
}

const cats = ["Todas", ...new Set(TRACKS.map(t => t.c))];
cats.forEach(c => {
  const b = document.createElement('button');
  b.textContent = c;
  if (c === "Todas") b.classList.add('ativo');
  b.onclick = () => {
    filtro = c;
    [...filtros.children].forEach(x => x.classList.remove('ativo'));
    b.classList.add('ativo');
    render();
  };
  filtros.appendChild(b);
});

function render() {
  lista.innerHTML = '';
  TRACKS.forEach((t, i) => {
    if (filtro !== "Todas" && t.c !== filtro) return;
    const li = document.createElement('li');
    if (i === atual) li.classList.add('atual');
    li.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${t.id}/mqdefault.jpg"
             alt="" loading="lazy"
             onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${t.id}/0.jpg';">
        <div class="lupa">▶</div>
      </div>
      <div class="titulo">${t.t}</div>
      <div class="tag ${CLASSES[t.c]}">${t.c}</div>
      <div class="play">${MODO_ARQUIVO ? '↗' : (i === atual ? '❚❚' : '▶')}</div>`;
    li.onclick = () => tocar(i);
    lista.appendChild(li);
  });
}

function tocar(i) {
  atual = i;
  const t = TRACKS[i];

  // MODO ARQUIVO: sem endereço de site, o YouTube recusa o player (Erro 153).
  // Vai direto para o YouTube, sem mostrar erro.
  if (MODO_ARQUIVO) {
    window.open('https://www.youtube.com/watch?v=' + t.id, '_blank');
    render();
    return;
  }

  // MODO SITE: player embutido funciona normalmente.
  player.innerHTML = `
    <p class="tocando">▶ Tocando agora: ${t.t}</p>
    <div class="video-box" id="vbox">
      <iframe id="vframe"
        src="https://www.youtube.com/embed/${t.id}?autoplay=1&rel=0&playsinline=1"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
    <div class="nav-btns">
      <button onclick="anterior()">⟵ Anterior</button>
      <button onclick="proxima()">Próxima ⟶</button>
      <button class="destaque" onclick="window.open('https://www.youtube.com/watch?v=${t.id}','_blank')">Abrir no YouTube ↗</button>
    </div>`;
  render();
  player.scrollIntoView({behavior:'smooth', block:'center'});
}
function proxima() { tocar((atual + 1) % TRACKS.length); }
function anterior() { tocar((atual - 1 + TRACKS.length) % TRACKS.length); }

render();
</script>
</body>
</html>
